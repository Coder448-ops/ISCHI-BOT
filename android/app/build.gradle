apply plugin: 'com.android.application'

// Release secrets are supplied only by the CI secret store / local environment.
// Never write keystore passwords into this repository or the WebView bundle.
def releaseSigningKeys = ['ANDROID_KEYSTORE_PATH', 'ANDROID_KEYSTORE_PASSWORD', 'ANDROID_KEY_ALIAS', 'ANDROID_KEY_PASSWORD']
def hasReleaseSigning = releaseSigningKeys.every { System.getenv(it) != null && !System.getenv(it).isEmpty() }

android {
    namespace = 'uz.ischi.industrial'
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId 'uz.ischi.industrial'
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode System.getenv('ANDROID_VERSION_CODE')?.toInteger() ?: 1
        versionName System.getenv('ANDROID_VERSION_NAME') ?: '1.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        aaptOptions { ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~' }
    }
    if (hasReleaseSigning) {
        signingConfigs {
            release {
                storeFile file(System.getenv('ANDROID_KEYSTORE_PATH'))
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) signingConfig signingConfigs.release
        }
    }
}

repositories { flatDir { dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs' } }
dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}
apply from: 'capacitor.build.gradle'

gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { it.name == 'assembleRelease' || it.name == 'bundleRelease' }) {
        if (!hasReleaseSigning) throw new GradleException('Signed release requires all four ANDROID_KEYSTORE_* / ANDROID_KEY_* environment variables. Use assembleDebug for an explicitly unsigned testing build.')
    }
}
