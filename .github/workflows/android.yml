name: Android APK
on:
  workflow_dispatch:
    inputs:
      signed_release:
        description: 'Build signed release (requires all four signing secrets)'
        type: boolean
        default: false
  push:
    tags: ['android-v*']
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_API_URL: ${{ vars.ANDROID_API_URL }}
      ANDROID_VERSION_CODE: ${{ github.run_number }}
      ANDROID_VERSION_NAME: '1.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require real persistent backend URL
        shell: bash
        run: |
          if [[ ! "$VITE_API_URL" =~ ^https://[^/]+$ ]]; then
            echo '::error::Set repository variable ANDROID_API_URL to the real HTTPS backend origin (no path). The APK cannot use an ephemeral filesystem.'
            exit 1
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - uses: gradle/actions/setup-gradle@7296c772c13d12d9871528814b51fb2143c138ef # v6.4.1
      - run: npm ci
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: npm run mobile:sync
      - name: Build installable debug APK
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.signed_release }}
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug
      - name: Validate signing configuration
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.signed_release }}
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" || -z "$STORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo '::error::All four ANDROID signing secrets are required.'
            exit 1
          fi
      - name: Decode ephemeral signing key
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.signed_release }}
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ischi-release.jks"
      - name: Build signed release APK
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.signed_release }}
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/ischi-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease
      - name: Remove signing key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/ischi-release.jks"
      - name: Collect APK
        shell: bash
        run: |
          mkdir -p apk-output
          if [[ -f android/app/build/outputs/apk/release/app-release.apk ]]; then
            cp android/app/build/outputs/apk/release/app-release.apk apk-output/ISCHI-Industrial-release.apk
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk apk-output/ISCHI-Industrial-debug.apk
          fi
          sha256sum apk-output/*.apk > apk-output/SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ISCHI-Android-${{ github.run_number }}
          path: apk-output/
          retention-days: 30
          if-no-files-found: error
